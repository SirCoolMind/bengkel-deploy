# Nginx: pintu masuk aplikasi untuk pengguna (port 8080).
#
#   sudo cp deploy/nginx/inventori.conf /etc/nginx/conf.d/   letak fail ini di tempat Nginx membacanya
#   sudo nginx -t                                            semak fail ini (ada salah taip?)
#   sudo nginx                                               mula Nginx   (server sebenar: sudo systemctl start nginx)
#   sudo nginx -s reload                                     baca semula fail ini selepas anda mengubahnya

server {
    listen 8080;

    # 1. Fail aplikasi: hasil "npm run build" (folder dist/) disalin ke sini
    root /var/www/inventori;

    # 2. Alamat /api/... dihantar ke API dalam PM2 (port 3000).
    #    "/" di hujung membuang /api:  /api/assets → http://127.0.0.1:3000/assets
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
    }

    # 3. Alamat lain yang bukan fail sebenar → index.html (Vue yang paparkan halaman itu)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
