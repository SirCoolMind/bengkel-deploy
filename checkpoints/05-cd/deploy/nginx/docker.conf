# Nginx DI DALAM container web. Sama seperti deploy/nginx/inventori.conf, kecuali tiga baris:
#   listen 80                      Docker sambungkan port 9000 komputer → port 80 container (lihat compose.yaml)
#   root /usr/share/nginx/html     Dockerfile menyalin dist/ ke sini
#   proxy_pass http://api:3000/    "api" = nama service dalam compose.yaml (bukan 127.0.0.1)

server {
    listen 80;

    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:3000/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
